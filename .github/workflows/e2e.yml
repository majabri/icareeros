name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Serialise every E2E run in the repo, across all branches and PRs.
#
# The group key is a CONSTANT on purpose. The usual `${{ github.ref }}` key
# only stops a branch racing itself, and that is not the hazard here: 24 of
# the 33 spec files log in as the single shared E2E_TEST_EMAIL account and
# mutate that one user's rows. Two different PRs running at the same time
# therefore corrupt each other's fixtures and fail for reasons that have
# nothing to do with either diff. A constant key is what actually makes the
# account a serialised resource.
#
# cancel-in-progress is false because a half-killed run leaves the shared
# account in whatever state it had reached, which is worse than waiting.
#
# Known tradeoff, worth stating rather than discovering later: GitHub queues
# at most ONE pending run per group. If three runs are triggered while a
# fourth is executing, the middle one is superseded and reports as
# `cancelled`. That is a queue eviction, not a timeout and not a test
# failure — check whether a newer run for the same ref exists before
# treating a cancelled E2E run as a signal.
concurrency:
  group: e2e-shared-test-account
  cancel-in-progress: false

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    # 45 was too tight and was silently killing runs: #426's run on the old
    # 5-project config was cancelled at 45m19s with zero failed jobs, which is
    # this ceiling, not a test failure. That is the real cause of the "cancelled"
    # E2E runs going back months — there is no concurrency group in this file.
    #
    # The suite is slow for a structural reason: 24 of 33 spec files log in
    # through the UI as the shared E2E_TEST_EMAIL account, and there is no
    # globalSetup/storageState to reuse a session, so the login flow is paid
    # once per file. Fixing that is the real speed-up (see #433) and would let
    # this come back down. Until then, give the job room to finish rather than
    # reporting a timeout as though it were a test result.
    #
    # workers stays at 1 deliberately: those 24 files share ONE account, so
    # parallel workers would mutate the same user's data concurrently.
    timeout-minutes: 75

    env:
      # Tests run against the live Vercel deployment — no local server needed
      PLAYWRIGHT_BASE_URL: https://icareeros.vercel.app
      # Supabase dev project (kuneabeiwcxavvyyfjkx)
      NEXT_PUBLIC_SUPABASE_URL: https://kuneabeiwcxavvyyfjkx.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      # Dedicated E2E test user credentials — enables dashboard content tests
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      # Service role key — used ONLY by e2e/support.spec.ts to delete the
      # tickets it creates. Without it the suite has no way to clean up after
      # itself: every run adds two "E2E test:" tickets that are never removed,
      # and the count has gone 34 -> 43 -> 58 -> 79. Past ~70 rows the list
      # assertion in that spec matched so many elements it failed on its own
      # accumulated junk. The spec degrades gracefully when this is unset, so
      # this line is inert until the repository secret is actually added.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: e2e/dashboard.spec.ts and e2e/profile.spec.ts build a
          # Supabase client in Node, and supabase-js realtime needs a native
          # WebSocket. On Node 20 every such test died with "Node.js detected
          # but native WebSocket not found. Suggested solution: Ensure you are
          # running Node.js 22+". Node 20 is deprecated on Actions runners
          # anyway — the runner already warns it is forcing Node 24 for the
          # actions themselves. pr-checks.yml stays on 20 deliberately: it is
          # green there and this change is scoped to the failure it fixes.
          node-version: "22"
          # No cache: package-lock.json is not committed (uses npm install --legacy-peer-deps)

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test --retries=2

      # A failed run used to report only which tests failed, never why: the
      # assertion detail is interleaved thousands of lines up, and no report was
      # ever written or uploaded. These two steps close that gap.
      #
      # Order matters. Upload runs FIRST because it prints a "Uploaded bytes"
      # progress line per 8MB chunk — hundreds of lines that would bury the
      # digest. The digest runs LAST so it is the final thing in the log, which
      # is the only part reachable by tooling that tails a job log.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # playwright-report/ is self-contained: the HTML reporter copies the
          # screenshots and traces it needs into it. Uploading test-results/
          # wholesale as well shipped the same attachments a second time and
          # produced a 2GB artifact. Take the report plus only the JSON the
          # digest parses.
          path: |
            playwright-report/
            test-results/results.json
          retention-days: 7
          if-no-files-found: warn

      - name: Failure digest
        if: failure()
        run: node scripts/e2e-failure-digest.mjs test-results/results.json
